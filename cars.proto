syntax = "proto3";
package cars;
option go_package = "lab6/pb";
service Cars {
 rpc Create(Car) returns (ID);
 rpc GetByID(ID) returns (Car);
 rpc MarkSold(ID) returns (Result);
}
message Car { string id = 1; string brand = 2; string model = 3; int32 year = 4; double price = 5; bool sold = 6; }
message ID { string id = 1; }
message Result { string message = 1; }
