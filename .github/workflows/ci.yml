name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    name: Build and Test Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Static analysis
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
      - name: Build
        run: go build ./...
      - name: Test and coverage
        run: go test -race -coverprofile=coverage.out ./...
      - name: Benchmark
        run: go test -run '^$' -bench '^BenchmarkGetByID$' -benchmem -count=5 . | tee benchmark.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-go-${{ matrix.go }}
          path: |
            coverage.out
            benchmark.txt
